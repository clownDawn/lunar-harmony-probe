<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lunar-probe3</title></head>
<body>
<h1>lunar-probe3</h1>
<pre id="out">boot</pre>
<script>
const out=document.getElementById('out');
const line=s=>{out.textContent+='\n'+s;};
function dsCall(m, data){
  try{
    const d=window._dsbridge;
    if(!d||typeof d.call!=='function'){line('NO_DS '+m);return;}
    const r=d.call(m, JSON.stringify({data: data===undefined?null:data}));
    line('CALL '+m+' => '+ (typeof r==='string'?r:JSON.stringify(r)));
  }catch(e){line('EX '+m+' '+e);}
}
line('href='+location.href);
line('_dsbridge='+typeof window._dsbridge);
if(window._dsbridge){
  line('keys='+Object.getOwnPropertyNames(window._dsbridge).join(','));
}
['get_user_id','get_app_info','get_app_mobile_request','get_app_version','native_login',
 'saveImageWithUrl','routerNavigateTo','executeAddWx','toBrowser','startAudioRecording',
 'startRecord','stopRecord','requestRecordPermission','openAlbumOrCamera',
 'downloadAndSaveImage','downloadAndSaveVideo'].forEach(m=>dsCall(m));
if(navigator.mediaDevices){
  navigator.mediaDevices.getUserMedia({video:true}).then(s=>{
    line('gUM video OK '+s.getTracks().map(t=>t.kind+':'+t.readyState).join(','));
    s.getTracks().forEach(t=>t.stop());
  }).catch(e=>line('gUM video FAIL '+e.name+':'+e.message));
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    line('gUM audio OK '+s.getTracks().map(t=>t.kind+':'+t.readyState).join(','));
    s.getTracks().forEach(t=>t.stop());
  }).catch(e=>line('gUM audio FAIL '+e.name+':'+e.message));
}
</script>
</body>
</html>
