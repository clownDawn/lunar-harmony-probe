<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lunar-probe2</title></head>
<body>
<h1>lunar-probe2</h1>
<pre id="out">boot</pre>
<script>
const out=document.getElementById('out');
const line=s=>out.textContent+='\n'+s;
line('href='+location.href);
line('top='+(window===top));
try{
  const d=window._dsbridge;
  line('_dsbridge type='+typeof d);
  if(d){
    line('_dsbridge keys='+Object.getOwnPropertyNames(d).join(','));
    line('_dsbridge proto='+Object.getOwnPropertyNames(Object.getPrototypeOf(d)||{}).join(','));
    ['get_user_id','app.get_user_id','app.get_app_info','app.get_app_mobile_request','get_app_info'].forEach(m=>{
      try{
        let r;
        if(typeof d.call==='function') r=d.call(m, JSON.stringify({data:null}));
        else if(typeof d==='function') r=d(m,'{}');
        line('call '+m+' => '+JSON.stringify(r));
      }catch(e){line('call '+m+' EX '+e)}
    });
  }
}catch(e){line('_dsbridge EX '+e)}
['app','jsBridge'].forEach(n=>line(n+'='+typeof window[n]));
if(navigator.mediaDevices){
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    line('gUM audio OK '+s.getTracks().map(t=>t.kind+':'+t.readyState+':'+t.label).join(','));
    s.getTracks().forEach(t=>t.stop());
  }).catch(e=>line('gUM FAIL '+e.name+':'+e.message));
  navigator.mediaDevices.getUserMedia({video:true}).then(s=>{
    line('gUM video OK '+s.getTracks().length);
    s.getTracks().forEach(t=>t.stop());
  }).catch(e=>line('gUM video FAIL '+e.name+':'+e.message));
}
</script>
</body>
</html>
