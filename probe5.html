<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lunar-probe5</title></head>
<body>
<h1>lunar-probe5</h1>
<pre id="out">boot</pre>
<script>
const out=document.getElementById('out');
const line=s=>{out.textContent+='\n'+s;};
function dsCall(m, arg){
  try{
    const d=window._dsbridge;
    if(!d||typeof d.call!=='function'){line('NO_DS '+m);return;}
    const payload = (arg===undefined) ? '{"data":null}' : (typeof arg==='string'?arg:JSON.stringify(arg));
    const r=d.call(m, payload);
    line('CALL '+m+' '+payload+' => '+(typeof r==='string'?r:JSON.stringify(r)));
  }catch(e){line('EX '+m+' '+e);}
}
line('href='+location.href);
line('cookie='+(document.cookie||'(empty)'));
line('_dsbridge='+typeof window._dsbridge);
dsCall('get_app_info');
dsCall('app.get_app_info');
dsCall('downloadAndSaveImage', {url:'https://clowndawn.github.io/lunar-harmony-probe/pixel.png'});
dsCall('downloadAndSaveImage', '{"url":"https://clowndawn.github.io/lunar-harmony-probe/pixel.png"}');
dsCall('openAlbumOrCamera', {type:1});
dsCall('openAlbumOrCamera', '{"type":1}');
dsCall('showNativeShareComponent', {payload:{type:1,image_url:'https://clowndawn.github.io/lunar-harmony-probe/pixel.png'}});
</script>
</body>
</html>
